---
################################################################################
#
#   Section: Organizations
#
#   - This section defines the different organizational identities which will
#   be referenced later in the configuration.
#
################################################################################
Organizations:
    - &Org3
        # DefaultOrg defines the organization which is used in the sampleconfig
        # of the fabric.git development environment
        Name: BankBMSP

        # ID to load the MSP definition as
        ID: BankBMSP

        MSPDir: ../organizations/peerOrganizations/bankb.sworna.example.com/msp

        Policies:
            Readers:
                Type: Signature
                Rule: "OR('BankBMSP.admin', 'BankBMSP.peer', 'BankBMSP.client')"
            Writers:
                Type: Signature
                Rule: "OR('BankBMSP.admin', 'BankBMSP.client')"
            Admins:
                Type: Signature
                Rule: "OR('BankBMSP.admin')"
            Endorsement:
                Type: Signature
                Rule: "OR('BankBMSP.peer')"
