# Per-bank Fabric peer + CA, run on the bank's OWN VM.
#
# One file defines both banks; the `banka` / `bankb` compose profiles select
# which bank a host runs (each VM runs only its own):
#   Bank A: docker compose --profile banka -f compose/compose-bank-peer.yaml up -d
#   Bank B: docker compose --profile bankb -f compose/compose-bank-peer.yaml up -d
#
# Env: SWORNA_CB_HOST  IP of the central-bank host (orderer + peer0.centralbank)
#      DOCKER_SOCK     default /var/run/docker.sock
#
# Project directory is network/compose, so `../` resolves to network/.
networks:
  test:
    name: fabric_test

volumes:
  peer0.banka.sworna.example.com:
  peer0.bankb.sworna.example.com:

services:
  ca_org2:
    image: hyperledger/fabric-ca:1.5.22
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org2
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
    ports:
      - "8054:8054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../organizations/fabric-ca/org2:/etc/hyperledger/fabric-ca-server
    container_name: ca_org2
    networks:
      - test
    profiles:
      - banka

  peer0.banka.sworna.example.com:
    container_name: peer0.banka.sworna.example.com
    image: hyperledger/fabric-peer:3.1.5
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_test
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.banka.sworna.example.com
      - CORE_PEER_ADDRESS=peer0.banka.sworna.example.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.banka.sworna.example.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.banka.sworna.example.com:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.banka.sworna.example.com:9051
      - CORE_PEER_LOCALMSPID=BankAMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0org2"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - ../organizations/peerOrganizations/banka.sworna.example.com/peers/peer0.banka.sworna.example.com:/etc/hyperledger/fabric
      - peer0.banka.sworna.example.com:/var/hyperledger/production
      - ./docker/peercfg:/etc/hyperledger/peercfg
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/host/var/run/docker.sock
    extra_hosts:
      - "orderer.sworna.example.com:${SWORNA_CB_HOST:?SWORNA_CB_HOST (CB host IP) must be set}"
      - "peer0.centralbank.sworna.example.com:${SWORNA_CB_HOST}"
    working_dir: /root
    command: peer node start
    ports:
      - "9051:9051"
    networks:
      - test
    profiles:
      - banka

  ca_org3:
    image: hyperledger/fabric-ca:1.5.22
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-org3
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=9054
    ports:
      - "9054:9054"
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes:
      - ../addOrg3/fabric-ca/org3:/etc/hyperledger/fabric-ca-server
    container_name: ca_org3
    networks:
      - test
    profiles:
      - bankb

  peer0.bankb.sworna.example.com:
    container_name: peer0.bankb.sworna.example.com
    image: hyperledger/fabric-peer:3.1.5
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_test
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.bankb.sworna.example.com
      - CORE_PEER_ADDRESS=peer0.bankb.sworna.example.com:11051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:11051
      - CORE_PEER_CHAINCODEADDRESS=peer0.bankb.sworna.example.com:11052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:11052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.bankb.sworna.example.com:11051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.bankb.sworna.example.com:11051
      - CORE_PEER_LOCALMSPID=BankBMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0org3"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - ../organizations/peerOrganizations/bankb.sworna.example.com/peers/peer0.bankb.sworna.example.com:/etc/hyperledger/fabric
      - peer0.bankb.sworna.example.com:/var/hyperledger/production
      - ./docker/peercfg:/etc/hyperledger/peercfg
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/host/var/run/docker.sock
    extra_hosts:
      - "orderer.sworna.example.com:${SWORNA_CB_HOST:?SWORNA_CB_HOST (CB host IP) must be set}"
      - "peer0.centralbank.sworna.example.com:${SWORNA_CB_HOST}"
    working_dir: /root
    command: peer node start
    ports:
      - "11051:11051"
    networks:
      - test
    profiles:
      - bankb