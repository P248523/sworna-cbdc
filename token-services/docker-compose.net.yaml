# Optional override for the CB host when banks run on their OWN VMs.
#
# Adds extra_hosts to the CB's auditor/issuer so they can reach the bank owner
# FSC nodes P2P (cross-owner transfers). Only apply this file when the bank IPs
# are known, e.g.:
#   docker compose -f docker-compose.yaml -f docker-compose.net.yaml up -d issuer auditor
#
# Env: SWORNA_BANKA_HOST, SWORNA_BANKB_HOST (Tailscale IPs of the bank VMs)
services:
  auditor:
    extra_hosts:
      - "owner1.sworna.example.com:${SWORNA_BANKA_HOST:?SWORNA_BANKA_HOST must be set}"
      - "owner2.sworna.example.com:${SWORNA_BANKB_HOST:?SWORNA_BANKB_HOST must be set}"

  issuer:
    extra_hosts:
      - "owner1.sworna.example.com:${SWORNA_BANKA_HOST:?SWORNA_BANKA_HOST must be set}"
      - "owner2.sworna.example.com:${SWORNA_BANKB_HOST:?SWORNA_BANKB_HOST must be set}"