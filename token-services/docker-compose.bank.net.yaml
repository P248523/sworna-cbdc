# Optional override for a bank host when banks run on their OWN VMs.
#
# Adds extra_hosts to the owner services so they can reach the CB host's
# orderer/auditor/issuer and the other bank's owner (cross-bank transfers).
# Apply together with docker-compose.bank.yaml, e.g.:
#   docker compose -f docker-compose.bank.yaml -f docker-compose.bank.net.yaml up -d owner1
#
# Env: SWORNA_CB_HOST (CB VM IP), SWORNA_OTHER_BANK_HOST (the OTHER bank VM IP)
services:
  owner1:
    extra_hosts:
      - "orderer.sworna.example.com:${SWORNA_CB_HOST:?SWORNA_CB_HOST must be set}"
      - "auditor.sworna.example.com:${SWORNA_CB_HOST}"
      - "issuer.sworna.example.com:${SWORNA_CB_HOST}"
      - "owner2.sworna.example.com:${SWORNA_OTHER_BANK_HOST:?SWORNA_OTHER_BANK_HOST must be set}"

  owner2:
    extra_hosts:
      - "orderer.sworna.example.com:${SWORNA_CB_HOST:?SWORNA_CB_HOST must be set}"
      - "auditor.sworna.example.com:${SWORNA_CB_HOST}"
      - "issuer.sworna.example.com:${SWORNA_CB_HOST}"
      - "owner1.sworna.example.com:${SWORNA_OTHER_BANK_HOST:?SWORNA_OTHER_BANK_HOST must be set}"